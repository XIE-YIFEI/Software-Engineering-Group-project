# ALPR settings. `common` applies to every profile; a profile overrides it.
# Pixel positions are fractions of the frame (0..1) so the same profile works at 720p / 1080p / 4K.
# Run:  python run_alpr.py --profile dashcam      (or cctv)
#       python run_image.py --source photo.jpg   (profile: image)
common:
  vehicle_model: yolov8s.pt
  plate_model: models/plate_malaysia.pt   # fine-tuned on the Malaysian Car Plate Dataset (two-row plates too);
                                         # models/finetuned.pt = the earlier model trained on Indian plates
  imgsz: 640
  vehicle_classes: [2, 3, 5, 7]      # COCO: car, motorcycle, bus, truck
  vehicle_conf: 0.35                 # a track is shown once its best detection reaches this
  track_conf: 0.10                   # boxes handed to ByteTrack (its low-score stage needs them)
  heavy_vehicle_conf: 0.55           # bus/truck: stricter, roadside LED billboards look like box trucks
  min_ground_y_frac: 0.0             # ignore vehicles whose bottom edge is above this (signs, overpasses)
  ignore_zones: []                   # [x1, y1, x2, y2] fractions; detections centred inside are dropped (watermarks)

  # which vehicles are close enough for plate reading
  min_vehicle_w_frac: 0.078
  min_vehicle_h_frac: 0.074

  # plate detection (every N frames per track; the box is carried along with the vehicle in between)
  plate_conf: 0.30
  plate_imgsz: 480
  plate_aspect_min: 0.8             # two-row plates (pickups, SUVs, trucks, motorcycles) are almost square
  plate_aspect_max: 6.0
  min_plate_w_px: 28
  min_plate_h_px: 10
  max_plate_w_frac: 0.50
  max_plate_h_frac: 0.30
  plate_det_interval: 2
  plate_ttl_frames: 15

  # OCR + voting
  ocr_backend: fast_plate_ocr        # plate-specific OCR; "easyocr" = generic fallback (much less accurate)
  ocr_model: cct-s-v2-global-model
  ocr_max_readings: 15               # budget for low-res reads per track; full-res plates (>= ocr_ref_plate_w)
                                     # are always read, and reads continue while the plate keeps growing
  ocr_ref_plate_w: 100               # votes are weighted by min(1, plate_width / this)^2: far plates misread
  min_sharpness: 30.0                # Laplacian variance on a 128px-wide crop
  sharp_ref: 300.0
  max_plate_corrections: 1
  resolve_ligatures: false          # W <-> VJ fix for EasyOCR misreads; not needed with fast_plate_ocr
  min_votes: 3
  confirm_conf: 0.6

  merge_gap_sec: 10.0                # same / near-identical plate on two tracks within 10 s = one vehicle
  log_min_status: CONFIRMED          # vehicles enter the plate log / results.json once CONFIRMED
                                     # (TENTATIVE readings still show, in amber, on the live vehicle label)
  count_line_y: 0.0                  # traffic-flow counting line, fraction of frame height (0 = off)

  # Plate verification (alpr/registry.py). The registry is SIMULATED: fictitious X-plates plus neutral
  # placeholders (no alerts possible) for every real plate in alpr/gt. Build/rebuild it with
  #   python -m alpr.registry --make-demo        (also built automatically when the file is missing)
  registry_enabled: false
  registry_path: data/registry/demo_registry.db
  registry_rules: [UNMATCHED, EXPIRED, ILLEGAL_FORMAT, BLACKLIST, TYPE_MISMATCH, DUPLICATE]
  registry_check_colour: false       # TYPE_MISMATCH also compares a rough HSV body colour (off: lighting-sensitive)
  registry_max_speed_kmh: 250        # DUPLICATE: same plate at two cameras needing a faster trip = cloned plate
  registry_misread_tolerance: true   # one character off a registered plate = probable OCR misread, no UNMATCHED
                                     # (seen on the demo: VCH 1587 briefly confirmed as VCR 1587)

  # HUD: "lead" = AR card on the main target (dashcam); "dashboard" = CCTV layout with plate log
  hud_mode: lead
  # HUD lead target
  lane_weight: 0.6
  lead_hysteresis: 1.25
  min_lead_w_frac: 0.104
  hud_title: "SECS Vision · Malaysia ALPR"

profiles:
  # Static images (python run_image.py / python -m alpr.eval_images). The plate detector runs on the
  # whole image, not on vehicle crops, so it needs a larger input size than the video profiles.
  image:
    source: ../Malaysian Car Plate Dataset/val/images
    out: outputs/images_alpr
    plate_conf: 0.25
    plate_imgsz: 640
    plate_aspect_min: 0.7            # two-row plates (SUVs, motorcycles) are almost square
    plate_aspect_max: 7.0
    min_plate_w_px: 16
    min_plate_h_px: 8
    ocr_tta: false                   # multi-margin OCR averaging: no gain on the val set, 3x OCR cost

  dashcam:
    source: data/videos/malaysia_kl_traffic.mp4
    start_sec: 49.0
    duration: 10.0
    out: outputs/malaysia_tracked_hud_10s.mp4
    min_ground_y_frac: 0.59
    ignore_zones: [[0.0, 0.82, 0.26, 1.0]]   # channel watermark, bottom-left of this clip
    hud_title: "SECS Vision · Malaysia ALPR"

  # Roadside ANPR camera, Malaysia (LILIN "INTEL AIDA ANPR TESTING", youtube.com/watch?v=raQOCJ_wzKE).
  # The clip is a screen recording of the vendor's NVR UI: frame_crop keeps only the camera image and
  # drops the vendor's own plate list (right) and ROI outline. 100-130 s is the busiest 30 s.
  malaysia_road_anpr:
    source: data/videos/malaysia_lilin_anpr_road.mp4
    start_sec: 100.0
    duration: 30.0
    out: outputs/malaysia_road_anpr_30s.mp4
    frame_crop: [0.0156, 0.0741, 0.7943, 0.9491]
    count_line_y: 0.62
    min_votes: 6                       # 30 FPS, a read every 2nd frame: confirm after ~0.4 s of readings
    hud_mode: dashboard
    hud_title: "SECS Vision · Malaysia Roadside ANPR"
    registry_enabled: true
    video_start_time: "2026-10-14T08:00:00"   # notional clock for the demo (road-tax / travel checks)
    camera_name: "KL roadside ANPR (demo)"
    camera_latlon: [3.1390, 101.6869]
    # SIMULATED events: fictitious plates (X-series, see alpr/registry.py DEMO_SCENARIOS) added to the
    # plate log at these video seconds to demonstrate the alerts. They are marked SIMULATED on the
    # dashboard and kept apart from the camera's plates in *.plates.json. Real vehicles are never flagged.
    registry_sim_events:
      - {at_sec: 103.0, plate: XSB2002, vtype: Car}      # BLACKLIST (reported stolen)
      - {at_sec: 110.0, plate: XSA1001, vtype: Car}      # EXPIRED road tax + TYPE_MISMATCH (registered motorcycle)
      - {at_sec: 117.0, plate: XSE5005, vtype: Car}      # UNMATCHED (no record)
      - {at_sec: 124.0, plate: XSD4004, vtype: Car}      # DUPLICATE (seen in Johor Bahru 17 min earlier)

  # Violation demo: the whole roadside clip (155 s) with SIMULATED violations ON actual vehicles.
  # data/videos/malaysia_road_violations_SIMULATED.mp4 is made by `python -m alpr.simulate`
  # (alpr/simulation.yaml): 7 vehicles carry digitally inserted fictitious plates (X-series or
  # malformed), every other plate is real. The pipeline does not know which ones were altered.
  malaysia_road_violations:
    source: data/videos/malaysia_road_violations_SIMULATED.mp4
    start_sec: 0.0
    duration: 0.0
    out: outputs/malaysia_road_violations.mp4
    count_line_y: 0.62
    min_votes: 6
    hud_mode: dashboard
    hud_title: "SECS Vision · Malaysia Roadside ANPR · Violation Check"
    hud_banner: "Simulation · 7 vehicles carry digitally inserted fictitious plates (X-series or malformed). All other plates are real."
    summary_sec: 8.0
    registry_enabled: true
    video_start_time: "2026-10-14T08:00:00"
    camera_name: "KL roadside ANPR (demo)"
    camera_latlon: [3.1390, 101.6869]

  # Second scene: guardhouse barrier gate (YouTube "License plate recognition system for guard house",
  # LEAF SMART COMMUNITY, youtube.com/watch?v=eNIGPl-W2II). Same model and thresholds as
  # malaysia_road_anpr; only the scene geometry differs. frame_crop drops the top strip with the
  # vendor's own plate overlay and logos. Registry checks stay off: every vehicle here is real.
  malaysia_guardhouse:
    source: data/videos/malaysia_guardhouse_lpr.mp4
    start_sec: 66.0
    duration: 30.0
    out: outputs/malaysia_guardhouse_30s.mp4
    frame_crop: [0.0, 0.145, 1.0, 1.0]
    count_line_y: 0.72                 # vehicles leaving through the gate cross it
    min_votes: 6
    hud_mode: dashboard
    hud_title: "SECS Vision · Malaysia Guardhouse Gate LPR"

  malaysia_cctv_urban:
    source: data/videos/malaysia_kl_city_cctv.mp4
    start_sec: 0.0
    duration: 28.0
    out: outputs/malaysia_cctv_urban_28s.mp4
    min_ground_y_frac: 0.35
    min_vehicle_w_frac: 0.05
    min_vehicle_h_frac: 0.05
    min_plate_w_px: 20
    min_plate_h_px: 6
    plate_conf: 0.15
    lane_weight: 0.0
    min_lead_w_frac: 0.0
    hud_title: "SECS Vision · Kuala Lumpur Bukit Bintang CCTV"

  malaysia_cctv_highway:
    source: data/videos/candidates/malaysia_sgbuloh_overhead.mp4
    start_sec: 0.0
    duration: 30.0
    out: outputs/malaysia_cctv_highway_30s.mp4
    min_ground_y_frac: 0.25
    min_vehicle_w_frac: 0.035
    min_vehicle_h_frac: 0.035
    min_plate_w_px: 16
    min_plate_h_px: 5
    plate_conf: 0.15
    lane_weight: 0.0
    min_lead_w_frac: 0.0
    hud_title: "SECS Vision · PLUS Highway Overhead Gantry CCTV"

  malaysia_cctv_junction:
    source: data/videos/candidates/malaysia_kotabharu_traffic.mp4
    start_sec: 0.0
    duration: 30.0
    out: outputs/malaysia_cctv_junction_30s.mp4
    min_ground_y_frac: 0.20
    min_vehicle_w_frac: 0.04
    min_vehicle_h_frac: 0.04
    min_plate_w_px: 18
    min_plate_h_px: 6
    plate_conf: 0.15
    lane_weight: 0.0
    min_lead_w_frac: 0.0
    hud_title: "SECS Vision · Kota Bharu Intersection CCTV"

  cctv:
    source: data/videos/anpr_sample_clear.mp4
    start_sec: 8.0
    duration: 8.0
    out: outputs/cctv_anpr_tracked_clear.mp4
    vehicle_classes: [2, 5, 7]
    vehicle_conf: 0.30
    heavy_vehicle_conf: 0.30
    min_ground_y_frac: 0.185
    min_vehicle_w_frac: 0.0625
    plate_conf: 0.25
    plate_aspect_min: 1.5
    plate_aspect_max: 5.5
    plate_det_interval: 1
    lane_weight: 0.0
    min_lead_w_frac: 0.0
    hud_title: "SECS Vision · Highway ANPR"
